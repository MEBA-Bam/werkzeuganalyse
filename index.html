<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WerkzeugAnalyse v7.0</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg0:#F5F5F7;--bg1:#FFFFFF;--bg2:#F5F5F7;--bg3:#E8E8ED;
  --txt0:#1D1D1F;--txt1:#3D3D3F;--txt2:#86868B;
  --brd:rgba(0,0,0,.08);--brd2:rgba(0,0,0,.15);
  --acc:#1D1D1F;--acc2:#0071E3;
  --ok:#34C759;--okbg:#F0FFF4;
  --wa:#FF9500;--wabg:#FFF8ED;
  --ba:#FF3B30;--babg:#FFF2F1;
  --inf:#0071E3;--infbg:#EBF4FF;
  --gruen:#34C759;--greenbg:#F0FFF4;
  --gelb:#FF9500;--gelbbg:#FFF8ED;
  --rot:#FF3B30;--rotbg:#FFF2F1;
  --r:10px;--r2:14px;--r3:18px;--r4:22px;
  --shadow:0 2px 12px rgba(0,0,0,.07);
  --shadow2:0 8px 40px rgba(0,0,0,.14);
  --company-color:#1D1D1F;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg0);color:var(--txt0);min-height:100vh;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

/* ---- LAYOUT ---- */
#app{display:flex;flex-direction:column;min-height:100vh}

/* ---- HEADER ---- */
.hdr{background:rgba(29,29,31,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;display:flex;align-items:center;gap:12px;padding:0 22px;height:52px;position:sticky;top:0;z-index:200;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.08)}
.hdr-logo-area{display:flex;align-items:center;gap:10px}
.hdr-logo-img{height:32px;width:auto;object-fit:contain}
.hdr-logo-fallback{width:32px;height:32px;background:rgba(255,255,255,0.15);border-radius:7px;display:flex;align-items:center;justify-content:center}
.hdr-appname{font-size:14px;font-weight:600;letter-spacing:.02em}
.hdr-company{font-size:11px;opacity:.5;margin-left:2px}
.hdr-ver{font-size:9px;opacity:.35;font-family:'Courier New',monospace;margin-left:4px;letter-spacing:.05em}
.hdr-nav{display:flex;gap:2px;margin-left:auto}
.nb{padding:6px 13px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,.55);font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
.nb:hover{background:rgba(255,255,255,.1);color:#fff}
.nb.on{background:rgba(255,255,255,.18);color:#fff;font-weight:500}
.hdr-user{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:20px;background:rgba(255,255,255,.1);cursor:pointer;font-size:12px;color:rgba(255,255,255,.8);margin-left:8px;border:none;font-family:inherit;transition:background .15s}
.hdr-user:hover{background:rgba(255,255,255,.18)}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}

/* ---- MAIN ---- */
.main{flex:1;padding:22px 24px;max-width:1180px;margin:0 auto;width:100%}

/* ---- CARDS ---- */
.card{background:var(--bg1);border:0.5px solid var(--brd);border-radius:var(--r3);padding:18px 20px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:600;color:var(--txt0);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ct-icon{width:22px;height:22px;background:var(--bg2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}

/* ---- METRICS ---- */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.metric{background:var(--bg2);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc2);border-radius:3px 0 0 3px}
.metric.ok::before{background:var(--ok)}.metric.wa::before{background:var(--wa)}.metric.ba::before{background:var(--ba)}
.m-lbl{font-size:10px;font-weight:500;color:var(--txt2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.m-val{font-size:26px;font-weight:300;color:var(--txt0);font-variant-numeric:tabular-nums}
.m-sub{font-size:10px;color:var(--txt2);margin-top:3px}

/* ---- GRID ---- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ---- SECTION LABEL ---- */
.sec{font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

/* ---- BADGES ---- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:980px;font-size:11px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-wa{background:var(--wabg);color:var(--wa)}
.b-ba{background:var(--babg);color:var(--ba)}
.b-inf{background:var(--infbg);color:var(--inf)}
.b-neu{background:var(--bg2);color:var(--txt1)}
.b-acc{background:var(--acc);color:#fff}
.b-gruen{background:var(--greenbg);color:var(--gruen)}
.b-gelb{background:var(--gelbbg);color:var(--gelb)}
.b-rot{background:var(--rotbg);color:var(--rot)}

/* ---- BUTTONS ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 20px;border-radius:980px;border:none;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--acc2);color:#fff}.btn-p:hover{background:#0077ED}.btn-p:disabled{background:#aaa;cursor:not-allowed;transform:none}
.btn-s{background:var(--bg2);color:var(--txt0);border:none}.btn-s:hover{background:var(--bg3)}
.btn-ok{background:var(--okbg);color:var(--ok);border:0.5px solid rgba(59,109,17,.2)}.btn-ok:hover{background:#d4ebbf}
.btn-wa{background:var(--wabg);color:var(--wa);border:0.5px solid rgba(133,79,11,.2)}
.btn-ba{background:var(--babg);color:var(--ba);border:0.5px solid rgba(163,45,45,.2)}.btn-ba:hover{background:#f7c8c8}
.btn-acc{background:var(--acc2);color:#fff}.btn-acc:hover{background:#3d36a0}
.btn-wide{width:100%}

/* ---- FORMS ---- */
.fg{margin-bottom:13px}
.fl{font-size:11px;font-weight:500;color:var(--txt1);display:block;margin-bottom:4px}
.fl span{color:#e53}
.fi,.fs,.fta{width:100%;padding:9px 13px;border:0.5px solid var(--brd);border-radius:var(--r2);background:var(--bg2);font-size:13px;font-family:inherit;background:var(--bg1);color:var(--txt0);outline:none;transition:border-color .15s}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--acc2);background:var(--bg1);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.fta{resize:vertical;min-height:68px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.f-hint{font-size:10px;color:var(--txt2);margin-top:3px}

/* ---- UPLOAD ZONE ---- */
.upz{border:1.5px dashed var(--brd2);border-radius:var(--r2);padding:28px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2)}
.upz:hover,.upz.hover{border-color:var(--acc2);background:#EEEDFE}
.upz.has{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.upz img{max-width:100%;max-height:200px;border-radius:7px;object-fit:cover}

/* ---- STEPPER ---- */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:20px}
.step-item{display:flex;align-items:center;gap:8px;flex:1}
.step-item:last-child{flex:none}
.step-c{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;transition:all .2s}
.step-c.done{background:var(--ok);color:#fff}
.step-c.active{background:var(--acc);color:#fff}
.step-c.todo{background:var(--bg3);color:var(--txt2)}
.step-lbl{font-size:11px;color:var(--txt1)}.step-lbl.active{font-weight:600;color:var(--txt0)}
.step-line{flex:1;height:1px;background:var(--brd2);margin:0 6px}

/* ---- TABLE ---- */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:7px 12px;font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;border-bottom:0.5px solid var(--brd);background:var(--bg2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:0.5px solid var(--brd);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg2);cursor:pointer}
.tbl-empty{padding:40px;text-align:center;color:var(--txt2);font-size:13px}

/* ---- DETAIL GRID ---- */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.detail-item{background:var(--bg2);border-radius:var(--r);padding:10px 12px}
.detail-lbl{font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.detail-val{font-size:12px;line-height:1.5;color:var(--txt0)}

/* ---- BAR CHARTS ---- */
.bar-row{margin-bottom:12px}
.bar-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.bar-name{font-size:12px;font-weight:500}
.bar-info{font-size:10px;color:var(--txt2)}
.bar-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 1s ease}

/* ---- AMPEL ---- */
.ampel-gruen{background:var(--greenbg);color:var(--gruen);border-left:4px solid var(--gruen)}
.ampel-gelb{background:var(--gelbbg);color:var(--gelb);border-left:4px solid var(--gelb)}
.ampel-rot{background:var(--rotbg);color:var(--rot);border-left:4px solid var(--rot)}

/* ---- HINT BOXES ---- */
.hint{background:var(--infbg);border-left:3px solid var(--inf);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;font-size:12px;color:var(--inf);line-height:1.6;margin-bottom:14px}
.warn-hint{background:var(--wabg);border-left:3px solid var(--wa);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;font-size:12px;color:var(--wa);line-height:1.6;margin-bottom:14px}
.ok-hint{background:var(--okbg);border-left:3px solid var(--ok);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;font-size:12px;color:var(--ok);line-height:1.6;margin-bottom:14px}

/* ---- TABS ---- */
.tabs{display:flex;gap:2px;background:var(--bg3);padding:3px;border-radius:var(--r2);margin-bottom:18px}
.tab{flex:1;padding:7px 10px;border-radius:10px;border:none;background:transparent;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;color:var(--txt2);transition:all .15s;text-align:center}
.tab.on{background:var(--bg1);color:var(--txt0);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tab:hover:not(.on){color:var(--txt0)}

/* ---- FILTER CHIPS ---- */
.filter-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fchip{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:500;border:0.5px solid var(--brd2);background:var(--bg1);cursor:pointer;transition:all .12s;font-family:inherit}
.fchip:hover{background:var(--bg2)}
.fchip.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* ---- MODAL ---- */
.modal-bg{position:fixed;inset:0;background:rgba(26,25,23,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--bg1);border-radius:var(--r3);padding:24px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:0.5px solid var(--brd)}

/* ---- NOTIFICATION ---- */
.notif{position:fixed;top:62px;right:20px;background:var(--acc);color:#fff;padding:10px 18px;border-radius:var(--r2);font-size:13px;box-shadow:var(--shadow2);z-index:999;animation:slideIn .25s ease,fadeOut .3s ease 2.7s forwards}
.notif.err{background:var(--ba)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOut{to{opacity:0;pointer-events:none}}

/* ---- PROGRESS ---- */
.prog{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:5px}
.prog-f{height:100%;border-radius:2px;background:var(--acc2);transition:width .4s}

/* ---- SPINNER ---- */
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
.spin-dark{width:16px;height:16px;border:2px solid var(--brd2);border-top-color:var(--txt0);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- DIVIDER ---- */
.div{height:0.5px;background:var(--brd);margin:16px 0}

/* ---- LOGIN ---- */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg0);padding:20px}
.login-card{background:var(--bg1);border-radius:var(--r4);padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.12);border:0.5px solid var(--brd)}
.err-box{background:var(--babg);color:var(--ba);border-radius:var(--r);padding:9px 12px;font-size:12px;margin-bottom:12px}

/* ---- TOOL ITEM ---- */
.tool-item{background:var(--bg1);border:0.5px solid var(--brd);border-radius:var(--r2);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;margin-bottom:7px}
.tool-item:hover{border-color:var(--brd2);box-shadow:var(--shadow);transform:translateY(-1px)}

/* ---- FOCUS BOX ---- */
.focus-box{background:#EEEDFE;border-left:3px solid var(--acc2);border-radius:0 var(--r) var(--r) 0;padding:11px 14px;margin-bottom:14px}
.focus-title{font-size:11px;font-weight:600;color:#26215C;margin-bottom:6px}
.focus-chip{display:inline-flex;align-items:center;gap:3px;margin:2px 3px;padding:2px 8px;background:rgba(255,255,255,.65);border-radius:5px;font-size:11px;color:#3C3489}

/* ---- PDF PRINT STYLES ---- */
@media print {
  .hdr,.nb,.btn,.hdr-nav,.hdr-user,.modal-bg{display:none!important}
  .main{padding:0;max-width:100%}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  #pdf-report{display:block!important}
}
#pdf-report{display:none}

/* ---- RESPONSIVE ---- */
@media(max-width:768px){
  .metrics,.g2,.g3,.g4,.fgrid,.fgrid3,.detail-grid{grid-template-columns:1fr}
  .hdr-nav{display:none}
  .main{padding:14px}
}
</style>
</head>

async function sbRequest(method,path,body){const opts={method,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'resolution=merge-duplicates':''}};if(body)opts.body=JSON.stringify(body);const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,opts);if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null;}
async function storageSave(){try{if(S.entries.length)await sbRequest('POST','entries?on_conflict=id',S.entries.map(e=>({id:e.id,data:e})));if(S.lernFaelle.length)await sbRequest('POST','lernfaelle?on_conflict=id',S.lernFaelle.map(f=>({id:f.id,data:f})));if(S.laborFaelle&&S.laborFaelle.length)await sbRequest('POST','lernfaelle?on_conflict=id',S.laborFaelle.map(f=>({id:'lab_'+f.id,data:f})));if(S.wissenDok&&S.wissenDok.length)await sbRequest('POST','lernfaelle?on_conflict=id',S.wissenDok.map(d=>({id:'dok_'+d.id,data:d})));await sbRequest('POST','settings?on_conflict=key',[{key:'settings',value:S.settings},{key:'users',value:S.users}]);
    if(S.batchItems&&S.batchItems.length){
      // Each batch item saved as own row in lernfaelle (prefix bat_) – includes image
      var batRows=S.batchItems.map(function(item){
        return {id:'bat_'+item.name.replace(/[^a-zA-Z0-9_-]/g,'_'), data:item};
      });
      // Save in chunks of 20 to avoid request size limits
      for(var ci=0;ci<batRows.length;ci+=20){
        await sbRequest('POST','lernfaelle?on_conflict=id',batRows.slice(ci,ci+20));
      }
      await sbRequest('POST','settings?on_conflict=key',[{key:'batchStep',value:S.batchStep||0}]);
    }
    const ind=document.getElementById('storage-ind');if(ind){ind.style.background='#34C759';ind.title='Gespeichert';}}catch(e){console.error('save:',e);try{localStorage.setItem('wa_entries',JSON.stringify(S.entries));}catch(_){}}}
async function storageLoad(){try{const r=await sbRequest('GET','entries?select=data&order=created_at.desc');if(r&&r.length)S.entries=r.map(x=>x.data);}catch(e){console.warn(e.message);}try{const r=await sbRequest('GET','lernfaelle?select=id,data&order=created_at.desc');if(r&&r.length){S.lernFaelle=r.filter(x=>!x.id.startsWith('lab_')&&!x.id.startsWith('dok_')).map(x=>x.data);S.laborFaelle=r.filter(x=>x.id.startsWith('lab_')).map(x=>x.data);S.wissenDok=r.filter(x=>x.id.startsWith('dok_')).map(x=>x.data);}}catch(e){console.warn(e.message);}try{const r=await sbRequest('GET','settings?select=key,value');if(r){const sv=r.find(x=>x.key==='settings');const uv=r.find(x=>x.key==='users');if(sv&&sv.value)S.settings=Object.assign({},S.settings,sv.value);if(uv&&uv.value&&uv.value.length)S.users=uv.value;}}catch(e){console.warn(e.message);}if(!S.entries.length){try{const d=localStorage.getItem('wa_entries');if(d)S.entries=JSON.parse(d);}catch(_){}}
  try{
    // Load batch items from lernfaelle table (prefix bat_)
    try {
      var batRows2=await sbRequest('GET','lernfaelle?select=id,data&id=like.bat_%25&order=created_at.asc');
      if(batRows2&&batRows2.length){
        S.batchItems=batRows2.map(function(r){return r.data;});
        console.log('Batch items loaded from Supabase:',S.batchItems.length);
      } else {
        console.log('No batch items in Supabase');
      }
    } catch(e2){ console.warn('Batch items load failed:',e2.message); }
    // Load batchStep
    const bsRows=await sbRequest('GET','settings?select=key,value&key=eq.batchStep');
    if(bsRows&&bsRows.length&&bsRows[0].value!==undefined) S.batchStep=bsRows[0].value;
  }catch(e){console.warn('batch load:',e.message);}
  S.storageReady=true;}

async function saveLabor() {
  const f = S.laborForm;
  if (!f.entryId)              { showNotif('Bitte Werkzeug auswählen.',true); return; }
  if (!f.untersuchungen.length){ showNotif('Bitte Untersuchung wählen.',true); return; }
  if (!f.fragestellung.trim()) { showNotif('Bitte Fragestellung eingeben.',true); return; }
  const fall = {
    id:uid(), datum:new Date().toISOString(), ersteller:S.user.name,
    entryId:f.entryId, untersuchungen:f.untersuchungen,
    prioritaet:f.prioritaet, fragestellung:f.fragestellung.trim(),
    probenvorbereitung:f.probenvorbereitung.trim(),
    anmerkungen:f.anmerkungen.trim(), zieltermin:f.zieltermin,
    status:'auftrag', ergebnistext:'', ergebnisbilder:[], kommentar:'',
  };
  S.laborFaelle.unshift(fall);
  await storageSave();
  showNotif('Laborauftrag erstellt!');
  S.laborForm = {entryId:'',untersuchungen:[],prioritaet:'normal',fragestellung:'',probenvorbereitung:'',anmerkungen:'',zieltermin:''};
  S.laborTab = 'uebersicht';
  re();
}

async function updateLaborStatus(id, status) {
  const f = S.laborFaelle.find(x => x.id===id);
  if (f) { f.status=status; await storageSave(); showNotif('Status aktualisiert.'); re(); }
}

async function saveErgebnis(id) {
  const f = S.laborFaelle.find(x => x.id===id);
  if (!f) return;
  const txt = document.getElementById('erg-text-'+id);
  const kom = document.getElementById('erg-kom-'+id);
  if (txt) f.ergebnistext = txt.value;
  if (kom) f.kommentar    = kom.value;
  f.status = 'ergebnis';
  await storageSave();
  showNotif('Ergebnis gespeichert.');
  re();
}

function handleErgebnisImg(e, laborId) {
  const fall = S.laborFaelle.find(x => x.id===laborId);
  if (!fall) return;
  if (!fall.ergebnisbilder) fall.ergebnisbilder = [];
  Array.from(e.target.files).forEach(file => {
    compressImage(file, compressed => {
      fall.ergebnisbilder.push({img:compressed, name:file.name, datum:new Date().toISOString()});
      storageSave(); re();
    });
  });
}

function toggleUntersuchung(uid) {
  const idx = S.laborForm.untersuchungen.indexOf(uid);
  if (idx>=0) S.laborForm.untersuchungen.splice(idx,1);
  else S.laborForm.untersuchungen.push(uid);
  re();
}

async function deleteLabor(id) {
  if (!confirm('Laborauftrag löschen?')) return;
  S.laborFaelle = S.laborFaelle.filter(f => f.id!==id);
  await deleteLaborFromDB(id);
  showNotif('Laborauftrag gelöscht.'); re();
}

function handleDokUpload(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name);
      const isPdf = /\.pdf$/i.test(file.name);
      const isXls = /\.xlsx?$/i.test(file.name);
      const dok = {
        id: uid(),
        datum: new Date().toISOString(),
        ersteller: S.user.name,
        name: file.name,
        typ: isPdf?'pdf':isXls?'excel':isImg?'bild':'sonstiges',
        kategorie: isPdf?'laborbericht':isXls?'messdaten':isImg?'mikroskopie':'sonstiges',
        titel: file.name.replace(/\.[^.]+$/,''),
        beschreibung: '',
        werkzeugbezug: '',
        data: ev.target.result,
        size: Math.round(file.size/1024),
      };
      // Show edit form for this doc
      S.pendingDok = dok;
      re();
    };
    reader.readAsDataURL(file);
  });
}

function handleBatchExcel(e) {
  const file = e.target.files[0];
  if (!file) return;
  loadXLSX(() => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb   = window.XLSX.read(ev.target.result, {type:'array'});
        const rows = [];
        wb.SheetNames.forEach(sheet => {
          const ws   = wb.Sheets[sheet];
          const json = window.XLSX.utils.sheet_to_json(ws, {defval:''});
          json.forEach(row => {
            let tool = sheet.trim();
            if (tool==='Andere'||tool==='andere') {
              const znr = String(row['Zeichnungsnummer:']||'').trim();
              const m   = znr.match(/(7266_\d{4})/);
              tool = m ? m[1] : znr;
            }
            const paRaw = String(row['PA-Nummer:']||'').trim();
            if (!paRaw||paRaw==='nan') return;
            const pa    = paRaw.replace(/[^0-9]/g,'');
            const coat  = normCoating(row['Schicht:']||'');
            const stRaw = String(row['Standzeit:']||'').trim();
            const st    = parseInt(stRaw.replace(/\./g,'').replace(/,/g,''))||0;
            if (!st) return;
            const nr    = String(row['Nummern:']||'').trim();
            let dm = '';
            Object.keys(row).forEach(k => { if(k.includes('Durchmesser')){ const v=String(row[k]).trim(); if(v&&!['nan','None','?','Kein Protokoll'].includes(v)) dm=v; }});
            const datum = String(row['Datum:']||'').trim();
            rows.push({
              tool, pa, paRaw, coating:coat, standzeit:st,
              nummer: nr==='nan'?'':nr,
              durchmesser: dm, datum: datum.startsWith('NaT')||datum==='nan'?'':datum.slice(0,10),
            });
          });
        });
        S.batchExcelRows = rows;
        showNotif('Excel geladen: ' + rows.length + ' Einträge');
        re();
      } catch(err) { showNotif('Excel-Fehler: '+err.message, true); }
    };
    reader.readAsArrayBuffer(file);
  });
}

function handleBatchFotos(e) {
  const files = Array.from(e.target.files).filter(f => /\.(jpg|jpeg|png)$/i.test(f.name));
  if (!S.batchItems) S.batchItems = [];
  let added = 0;
  files.forEach(file => {
    const existing = S.batchItems.find(x => x.name===file.name);
    if (existing) return;
    const parsed = parseFilename(file.name);
    // Match to Excel
    const excelMatch = matchBatchExcel(parsed, S.batchExcelRows||[]);
    const item = {
      name: file.name, parsed, excelMatch,
      img: null,
      // Lernfall fields
      schadensklasse: '', verschleissart: '',
      beschreibung: '', befund: '', empfehlung: '',
      reparatur: '', kommentar: '',
      // Override fields from Excel match
      tool:   excelMatch ? excelMatch.tool    : parsed.toolId,
      pa:     excelMatch ? excelMatch.pa      : parsed.pa,
      nummer: excelMatch ? excelMatch.nummer  : parsed.nummer,
      coating:excelMatch ? excelMatch.coating : '70004 (Duplex Variantic)',
      standzeit: excelMatch ? String(excelMatch.standzeit) : '',
      durchmesser: excelMatch ? excelMatch.durchmesser : '',
      datum: excelMatch ? excelMatch.datum : '',
      saved: false,
    };
    S.batchItems.push(item);
    added++;
    compressImage(file, function(compressed) {
      item.img = compressed;
      re();
      // Save this single item immediately to Supabase
      var batId='bat_'+item.name.replace(/[^a-zA-Z0-9_-]/g,'_');
      sbRequest('POST','lernfaelle?on_conflict=id',[{id:batId,data:item}]).catch(function(e){console.warn('batch save:',e.message);});
      // Auto-analyse if we have a good Excel match
      if (item.excelMatch && item.excelMatch.score >= 55) {
        const idx = S.batchItems.indexOf(item);
        if (idx >= 0) setTimeout(function(){ aiDescribeBatchItem(idx); }, 300);
      }
    });
  });
  if (added) { S.batchStep=0; re(); }
  else showNotif('Alle Dateien bereits vorhanden.',true);
}

function matchBatchExcel(parsed, rows) {
  if (!parsed.ok || !rows.length) return null;
  let best=null, bestScore=0;
  rows.forEach(row => {
    let score=0;
    if (row.tool===parsed.toolId) score+=40; else return;
    if (parsed.pa&&row.pa&&row.pa===parsed.pa) score+=40;
    if (parsed.nummer&&row.nummer&&row.nummer===parsed.nummer) score+=15;
    if (score>bestScore) { bestScore=score; best=row; }
  });
  return bestScore>=40 ? best : null;
}

async function saveBatchItem(idx) {
  const item = S.batchItems[idx];
  if (!item) return;
  if (!item.schadensklasse) { showNotif('Bitte Schadensklasse wählen.',true); return; }
  if (!item.beschreibung.trim()) { showNotif('Bitte Beschreibung eingeben.',true); return; }
  const fall = {
    id: uid(), datum: new Date().toISOString(), experte: S.user.name,
    tool: item.tool, coating: item.coating, coatingName: coatingName(item.coating),
    pa: item.pa, nummer: item.nummer, standzeit: parseStandzeit(item.standzeit),
    durchmesser: item.durchmesser, datumAusbau: item.datum,
    schadensklasse: item.schadensklasse, verschleissart: item.verschleissart,
    beschreibung: item.beschreibung.trim(), befund: item.befund,
    empfehlung: item.empfehlung.trim(), reparatur: item.reparatur,
    kommentar: item.kommentar.trim(),
    img: item.img, imgName: item.name,
    quelle: 'batch-excel',
  };
  S.lernFaelle.unshift(fall);
  item.saved = true;
  await storageSave();
  // Remove from batch table in Supabase after saving as Lernfall
  try { await sbRequest('DELETE','lernfaelle?id=eq.bat_'+item.name.replace(/[^a-zA-Z0-9_-]/g,'_')); } catch(e){}
  showNotif('Lernfall gespeichert! ('+S.lernFaelle.length+' Fälle gesamt)');
  // Move to next unsaved
  const nextIdx = S.batchItems.findIndex((x,i) => i>idx && !x.saved);
  if (nextIdx>=0) S.batchStep=nextIdx;
  re();
}

async function aiDescribeBatchItem(idx) {
  const item = S.batchItems[idx];
  if (!item || !item.img) { showNotif('Kein Foto vorhanden.',true); return; }
  item.aiLoading = true; re();
  const tp = toolProfile(item.tool);
  const fewShot = buildFewShotContext();
  const prompt = `Du bist Experte für Tiefziehwerkzeug-Verschleißanalyse.${fewShot}

Werkzeug: ${item.tool} | Beschichtung: ${coatingName(item.coating)} | PA: ${item.pa} | Nr.${item.nummer} | Standzeit: ${formatStandzeit(parseStandzeit(item.standzeit))} Hübe
${tp.fokus}

Analysiere das Stereomikroskop-Foto präzise.
Antworte NUR mit JSON ohne Markdown:
{"schadensklasse":"gruen","verschleissart":"Abrasion","beschreibung":"Detaillierte Beschreibung was im Bild sichtbar ist - mindestens 3 Sätze","befund":"Weiterverwenden","empfehlung":"Konkrete Empfehlung","reparatur":"","confidence":85}`;
  try {
    const result = await callClaude(prompt, item.img);
    const obj = JSON.parse(result.replace(/```json|```/g,'').trim());
    item.schadensklasse = obj.schadensklasse||'';
    item.verschleissart  = obj.verschleissart||'';
    item.beschreibung    = obj.beschreibung||'';
    item.befund          = obj.befund||'';
    item.empfehlung      = obj.empfehlung||'';
    item.reparatur       = obj.reparatur||'';
    showNotif('KI-Vorschlag erstellt – bitte prüfen und ggf. korrigieren.');
  } catch(err) { showNotif('KI-Fehler: '+err.message,true); }
  item.aiLoading = false; re();
}

        <div class="fg"><label class="fl">Titel</label><input class="fi" value="${dok.titel}" oninput="S.pendingDok.titel=this.value"></div>
        <div class="fg"><label class="fl">Kategorie</label><select class="fs" onchange="S.pendingDok.kategorie=this.value">${katOpts}</select></div>
        <div class="fg"><label class="fl">Werkzeugbezug (optional)</label><input class="fi" value="${dok.werkzeugbezug}" placeholder="z.B. 7266_0730" oninput="S.pendingDok.werkzeugbezug=this.value"></div>
        <div class="fg"><label class="fl">Dateigröße</label><input class="fi" value="${dok.size} KB" disabled></div>
      </div>
      <div class="fg"><label class="fl">Beschreibung / Inhalt</label>
        <textarea class="fta" rows="3" placeholder="Was ist in diesem Dokument? Welche Erkenntnisse enthält es? Diese Beschreibung hilft der KI das Dokument zu verstehen." oninput="S.pendingDok.beschreibung=this.value">${dok.beschreibung}</textarea></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-s" onclick="S.pendingDok=null;re()">Abbrechen</button>
        <button class="btn btn-ok" onclick="saveDokument(S.pendingDok);S.pendingDok=null">✓ Speichern</button>
      </div>
    </div>`;
  }

  const uploadBtn = `<div style="display:flex;gap:8px;margin-bottom:14px;align-items:center">
    <input type="file" id="dok-upload" accept=".pdf,.xlsx,.xls,.jpg,.jpeg,.png,.gif,.webp,.dwg,.dxf" multiple style="display:none" onchange="handleDokUpload(event)">
    <button class="btn btn-p" onclick="document.getElementById('dok-upload').click()">+ Dokumente hochladen</button>
    <span style="font-size:11px;color:var(--txt2)">PDF · Excel · Bilder · Zeichnungen</span>
    <span style="font-size:11px;color:var(--txt2);margin-left:auto">${docs.length} Dokumente</span>
  </div>`;

  const grid = docs.length===0
    ? `<div class="card" style="text-align:center;padding:40px;color:var(--txt2)">Noch keine Dokumente hochgeladen.</div>`
    : `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
        ${docs.map(dok => {
          const kat = DOK_KATEGORIEN.find(k=>k.id===dok.kategorie)||DOK_KATEGORIEN[5];
          const isImg = dok.typ==='bild';
          return `<div style="background:var(--bg1);border:0.5px solid var(--brd);border-radius:var(--r2);overflow:hidden">
            ${isImg&&dok.data?`<img src="${dok.data}" style="width:100%;height:120px;object-fit:cover">`
              :`<div style="height:80px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:32px">${kat.icon}</div>`}
            <div style="padding:10px 12px">
              <div style="font-size:12px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dok.titel}</div>
              <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
                <span class="badge b-inf" style="font-size:9px">${kat.icon} ${kat.name}</span>
                ${dok.werkzeugbezug?`<span class="badge b-neu" style="font-size:9px">${dok.werkzeugbezug}</span>`:''}
              </div>
              ${dok.beschreibung?`<div style="font-size:10px;color:var(--txt2);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${dok.beschreibung}</div>`:''}
              <div style="display:flex;gap:5px;margin-top:8px">
                ${dok.data?`<a href="${dok.data}" download="${dok.name}" class="btn btn-s" style="padding:3px 8px;font-size:10px">⬇ Download</a>`:''}
                <button class="btn btn-ba" style="padding:3px 8px;font-size:10px" onclick="deleteDokument('${dok.id}')">✕</button>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>`;

  return pendingForm + uploadBtn + grid;
}

function renderWissenSuche() {
  const lernN = S.lernFaelle.length;
  const dokN  = (S.wissenDok||[]).length;
  const q     = S.wissenSuche||'';

  // Combined search across lernfaelle + dokumente
  let results = [];
  if (q.trim().length >= 2) {
    const ql = q.toLowerCase();
    S.lernFaelle.forEach(f => {
      const text = [f.tool,f.coating,f.pa,f.beschreibung,f.empfehlung,f.verschleissart].join(' ').toLowerCase();
      if (text.includes(ql)) results.push({type:'lernfall', item:f});
    });
    (S.wissenDok||[]).forEach(d => {
      const text = [d.titel,d.beschreibung,d.werkzeugbezug,d.name].join(' ').toLowerCase();
      if (text.includes(ql)) results.push({type:'dokument', item:d});
    });
  }

  return `<div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px">
      <div class="metric"><div class="m-lbl">Lernfälle</div><div class="m-val">${lernN}</div><div class="m-sub">KI-Wissensbasis</div></div>
      <div class="metric ok"><div class="m-lbl">🟢 Grün</div><div class="m-val" style="color:var(--ok)">${S.lernFaelle.filter(f=>f.schadensklasse==='gruen').length}</div></div>
      <div class="metric wa"><div class="m-lbl">🟡 Gelb</div><div class="m-val" style="color:var(--wa)">${S.lernFaelle.filter(f=>f.schadensklasse==='gelb').length}</div></div>
      <div class="metric ba"><div class="m-lbl">🔴 Rot</div><div class="m-val" style="color:var(--ba)">${S.lernFaelle.filter(f=>f.schadensklasse==='rot').length}</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="fi" style="flex:1" placeholder="Suche in Lernfällen und Dokumenten..." value="${q}" oninput="S.wissenSuche=this.value;re()">
    </div>
    ${q.trim().length>=2 ? `
      <div style="font-size:12px;color:var(--txt2);margin-bottom:10px">${results.length} Treffer für "${q}"</div>
      ${results.map(r => {
        if (r.type==='lernfall') {
          const f=r.item; const sk=SCHADENSKLASSEN.find(s=>s.id===f.schadensklasse)||SCHADENSKLASSEN[1];
          return `<div style="background:var(--bg1);border:0.5px solid var(--brd);border-left:4px solid ${sk.farbe};border-radius:0 var(--r2) var(--r2) 0;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px">
            ${f.img?`<img src="${f.img}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;flex-shrink:0">`:''}
            <div><div style="font-size:12px;font-weight:600">${sk.icon} ${f.tool} · ${f.coatingName} · PA ${f.pa}</div>
            <div style="font-size:11px;color:var(--txt2)">${f.verschleissart} · ${formatStandzeit(f.standzeit)} Hübe</div>
            <div style="font-size:11px;margin-top:3px">${f.beschreibung.slice(0,120)}...</div></div>
          </div>`;
        } else {
          const d=r.item; const kat=DOK_KATEGORIEN.find(k=>k.id===d.kategorie)||DOK_KATEGORIEN[5];
          return `<div style="background:var(--bg1);border:0.5px solid var(--brd);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center">
            <div style="font-size:24px;flex-shrink:0">${kat.icon}</div>
            <div><div style="font-size:12px;font-weight:600">${d.titel}</div>
            <div style="font-size:11px;color:var(--txt2)">${kat.name}${d.werkzeugbezug?' · '+d.werkzeugbezug:''} · ${d.size} KB</div>
            ${d.beschreibung?`<div style="font-size:11px;margin-top:2px">${d.beschreibung.slice(0,100)}...</div>`:''}
            </div>
          </div>`;
        }
      }).join('')}
    ` : `
      <div class="hint">Tippe mindestens 2 Zeichen um in Lernfällen und Dokumenten zu suchen.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
        <div class="card">
          <div class="card-title"><span class="ct-icon">🧠</span>Lernfälle nach Werkzeug</div>
          ${Object.keys(TOOL_PROFILES).filter(k=>k!=='andere').map(k => {
            const n=S.lernFaelle.filter(f=>f.tool===k).length;
            return n>0?`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--brd);font-size:12px"><span>${k}</span><span class="badge b-inf">${n}</span></div>`:'';
          }).join('')}
          ${S.lernFaelle.length===0?'<div style="color:var(--txt2);font-size:12px;padding:12px 0">Noch keine Lernfälle.</div>':''}
        </div>
        <div class="card">
          <div class="card-title"><span class="ct-icon">📄</span>Dokumente nach Kategorie</div>
          ${DOK_KATEGORIEN.map(kat => {
            const n=(S.wissenDok||[]).filter(d=>d.kategorie===kat.id).length;
            return n>0?`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--brd);font-size:12px"><span>${kat.icon} ${kat.name}</span><span class="badge b-neu">${n}</span></div>`:'';
          }).join('')}
          ${dokN===0?'<div style="color:var(--txt2);font-size:12px;padding:12px 0">Noch keine Dokumente.</div>':''}
        </div>
      </div>
    `}
  </div>`;
}



function renderDashboardLabor() {
  var open = S.laborFaelle.filter(function(f){return f.status==='laufend'||f.status==='auftrag';});
  var h2 = '<div class="card" style="margin-bottom:12px"><div class="card-title"><span class="ct-icon">⚗️</span>Labor – In Arbeit ('+open.length+')</div>';
  if (!open.length) h2+='<div style="padding:12px;text-align:center;color:var(--txt2);font-size:12px">Keine offenen Laboraufträge.</div>';
  else open.slice(0,3).forEach(function(fall){
    var entry=S.entries.find(function(e){return e.id===fall.entryId;});
    var st=LAB_STATUS.find(function(s){return s.id===fall.status;})||LAB_STATUS[0];
    var unters=fall.untersuchungen.map(function(uid){var u=LAB_UNTERSUCHUNGEN.find(function(x){return x.id===uid;});return u?u.icon+' '+u.kurz:uid;}).join(' ');
    h2+='<div style="padding:9px 0;border-bottom:0.5px solid var(--brd)"><div style="display:flex;align-items:center;gap:7px;margin-bottom:2px"><span style="font-size:12px;font-weight:600">'+(entry?entry.tool:'–')+'</span><span class="badge" style="background:'+st.bg+';color:'+st.farbe+';font-size:10px">'+st.icon+' '+st.label+'</span></div><div style="font-size:11px;color:var(--txt2)">'+unters+(fall.fragestellung?' · '+fall.fragestellung.slice(0,50)+'...':'')+'</div></div>';
  });
  var btn=document.createElement('button');btn.className='btn btn-s btn-wide';btn.style.cssText='font-size:12px;margin-top:10px';btn.setAttribute('onclick',"setTab('labor')");btn.textContent='Labor \u00f6ffnen \u2192';
  h2+=btn.outerHTML+'</div>';return h2;
}

function compressImage(file, callback) {
  var MAX_SIZE = 300;
  var QUALITY  = 0.82;
  var reader   = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      if (w > MAX_SIZE || h > MAX_SIZE) {
        if (w > h) { h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; }
        else       { w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', QUALITY));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function callClaude(prompt, imageBase64) {
  const content = [];
  if (imageBase64) {
    const data = imageBase64.includes(',') ? imageBase64.split(',')[1] : imageBase64;
    content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data}});
  }
  content.push({type:'text', text:prompt});
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': ANTHROPIC_KEY,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({model:'claude-sonnet-4-20250514', max_tokens:900, messages:[{role:'user', content}]})
  });
  if (!resp.ok) throw new Error('API ' + resp.status + ': ' + await resp.text());
  const data2 = await resp.json();
  return data2.content.filter(x=>x.type==='text').map(x=>x.text).join('');
}

async function startBulkAnalysis() {
  if (S.importAnalysing) return;
  const pending = S.importFiles.filter(f=>f.status==='pending');
  if (!pending.length) { showNotif('Keine ausstehenden Dateien.',true); return; }
  S.importAnalysing=true; S.importProgress=0; re();
  let done=0;
  for (const item of S.importFiles) {
    if (item.status!=='pending') { done++; continue; }
    item.analysing=true; re();
    const tp=toolProfile(item.parsed.toolId);
    const coat=item.matchCoating||'70004 (Duplex Variantic)';
    const st=item.matchStandzeit?formatStandzeit(parseStandzeit(item.matchStandzeit)):'unbekannt';
    const prompt='Experte Tiefziehwerkzeug Verschleissanalyse. Werkzeug: '+item.parsed.toolId+' Beschichtung: '+coatingName(coat)+' PA: '+(item.parsed.pa||'?')+' Nr.'+(item.parsed.nummer||'?')+' Standzeit: '+st+'. '+tp.fokus+' NUR JSON: {"verdict":"Weiterverwenden","schicht":"Vorhanden gut","verschleisstyp":"Abrasion","bereiche":"Ziehflaeche","diagnose":"...","ursache":"...","empfehlung":"...","confidence":75}';
    try {
      const result = await callClaude(prompt, item.img||null);
      item.result=JSON.parse(result.replace(/```json|```/g,'').trim());
      item.status='analysed';
    } catch(err) {
      item.result={verdict:'Reparatur prüfen',schicht:'Vorhanden – leichter Verschleiß',verschleisstyp:'Abrasion',bereiche:tp.bereiche[0],diagnose:'Analyse nicht verfügbar.',ursache:'–',empfehlung:'Manuelle Prüfung.',confidence:0};
      item.status='analysed';
    }
    item.analysing=false; done++;
    S.importProgress=Math.round(done/S.importFiles.length*100); re();
  }
  S.importAnalysing=false;
  showNotif(pending.length+' Fotos analysiert!'); re();
}


function formatExcelDate(val) {
  if (!val) return '–';
  var s = String(val).trim();
  // Already a date string like 2025-10-23
  if (s.match(/^\d{4}-\d{2}-\d{2}/)) {
    try { return new Date(s).toLocaleDateString('de-AT'); } catch(e){ return s; }
  }
  // Excel serial number
  var n = parseInt(s);
  if (!isNaN(n) && n > 40000 && n < 60000) {
    // Excel epoch: Jan 1 1900 = 1, but Excel has a leap year bug so subtract 1
    var d = new Date((n - 25569) * 86400 * 1000);
    return d.toLocaleDateString('de-AT');
  }
  return s;
}

function loadXLSX(cb){
  if(window.XLSX){cb();return;}
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onload=()=>cb();
  s.onerror=()=>showNotif('SheetJS konnte nicht geladen werden.',true);
  document.head.appendChild(s);
}

function normCoating(c){
  const s=String(c||'').trim();
  if(!s||s==='nan')return '';
  if(s.includes('70004')||s.includes('Duplex Variantic'))return '70004 (Duplex Variantic)';
  if(s.includes('70063')||s.includes('Futura Nano'))return '70063 (Futura Nano)';
  if(s.includes('70019')||s.includes('Lumena'))return '70019 (Balinit Lumena)';
  if(s.includes('70068')||s.includes('Balinit Formera'))return '70068 (Balinit Formera)';
  if(s.includes('Formera Eifeler'))return 'Formera Eifeler Austria';
  if(s.includes('TiAlN'))return 'Eifeler TiAlN';
  if(s.includes('TOPMATIC'))return 'Voest TOPMATIC';
  if(s.includes('China')||s.includes('CYS'))return 'China (CYS)';
  return s;
}

function parseExcelFile(file){
  loadXLSX(()=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=window.XLSX.read(e.target.result,{type:'array'});
        const rows=[];
        wb.SheetNames.forEach(sheet=>{
          const ws=wb.Sheets[sheet];
          const json=window.XLSX.utils.sheet_to_json(ws,{defval:''});
          json.forEach(row=>{
            let tool=sheet.trim();
            if(tool==='Andere'||tool==='andere'){
              const znr=String(row['Zeichnungsnummer:']||'').trim();
              const m=znr.match(/(7266_\d{4})/);
              tool=m?m[1]:znr;
            }
            const paRaw=String(row['PA-Nummer:']||'').trim();
            if(!paRaw||paRaw==='nan')return;
            const paClean=paRaw.replace(/[^0-9]/g,'');
            const pa=paClean.length>=5?paClean:paRaw;
            const coat=normCoating(row['Schicht:']||'');
            const stRaw=String(row['Standzeit:']||'').trim();
            const st=parseInt(stRaw.replace(/\./g,'').replace(/,/g,''))||0;
            if(!st)return;
            const nr=String(row['Nummern:']||'').trim();
            const nrClean=['nan','None','Keine Nummern vorhanden','Ein Stempel ohne'].includes(nr)?'':nr;
            let dm='';
            Object.keys(row).forEach(k=>{ if(k.includes('Durchmesser')){ const v=String(row[k]).trim(); if(v&&!['nan','None','?','Kein Protokoll','Protokoll unvollständig'].includes(v)) dm=v; }});
            const datumRaw=String(row['Datum:']||'').trim();
            const datum=(datumRaw&&datumRaw!=='nan'&&datumRaw!=='NaT')?datumRaw.slice(0,10):'';
            const info=String(row['Info:']||'').trim().replace(/^nan$/,'');
            const meba=String(row['MEBA Anmerkung']||'').trim().replace(/^nan$/,'');
            const bildRaw=String(row['Bild erstellt']||'').trim();
            const bild=['✓','*','1','TRUE','True'].includes(bildRaw)?'1':'';
            rows.push({tool,pa,paRaw,coating:coat,standzeit:st,nummer:nrClean,durchmesser:dm,datum,info,meba,bild});
          });
        });
        S.excelRows=rows;
        showNotif(`Excel geladen: ${rows.length} Einträge`);
        S.importFiles.forEach(item=>{
          item.match=matchExcel(item.parsed);
          if(item.match?.row){ item.matchCoating=item.match.row.coating; item.matchStandzeit=String(item.match.row.standzeit); }
        });
        re();
      }catch(err){ showNotif('Excel-Fehler: '+err.message,true); }
    };
    reader.readAsArrayBuffer(file);
  });
}

// ============================================================
// FILENAME PARSER
// Schema: 7266_WWWW_V_SSSS_PPPPPP_NN.jpg
// ============================================================
function parseFilename(fn){
  const base=fn.replace(/\.[^.]+$/,'').replace(/\s+/g,'_');
  const res={ok:false,toolId:'andere',toolRaw:'',pa:'',nummer:'',version:'',werkstoff:'',aufnahme:'',filename:fn};
  const allNums=base.match(/\d+/g)||[];
  const wzM=base.match(/7266[A-Z]?[-_](\d{4})/i);
  const wz=wzM?wzM[1]:'';
  const toolId=wz?`7266_${wz}`:'andere';
  res.toolId=TOOL_PROFILES[toolId]?toolId:'andere';
  res.toolRaw=toolId;
  // PA: 6-digit 300000–399999
  for(const n of allNums){ if(n.length===6&&parseInt(n)>=300000&&parseInt(n)<400000){res.pa=n;break;} }
  // Werkzeug-Nr: short 1-2 digit at end
  for(let j=allNums.length-1;j>=0;j--){
    const nn=allNums[j];
    if(nn===res.pa||nn===wz||parseInt(nn)===7266)continue;
    if(nn.length<=2&&parseInt(nn)>0&&parseInt(nn)<100){res.nummer=nn;break;}
  }
  // Aufnahme T1/T2/T3
  const tM=base.match(/[_-][Tt](\d+)$/);
  if(tM) res.aufnahme='T'+tM[1];
  // Werkstoff
  const wsM=base.match(/[A-Z]{1,2}\d{3}/);
  if(wsM) res.werkstoff=wsM[0];
  // Version single letter
  const vM=base.match(/(?:^|_)([A-HJ-Z])(?:_|$)/i);
  if(vM) res.version=vM[1].toUpperCase();
  res.ok=!!wz;
  return res;
}

function matchExcel(parsed){
  if(!parsed?.ok||!S.excelRows.length)return null;
  let best=null,bestScore=0;
  for(const row of S.excelRows){
    let score=0;
    if(row.tool===parsed.toolId) score+=40; else continue;
    if(parsed.pa&&row.pa&&row.pa===parsed.pa) score+=40;
    else if(parsed.pa&&row.pa&&(row.pa.includes(parsed.pa)||parsed.pa.includes(row.pa))) score+=20;
    if(parsed.nummer&&row.nummer&&row.nummer.trim()===parsed.nummer) score+=15;
    if(score>bestScore){bestScore=score;best=row;}
  }
  if(!best||bestScore<40)return null;
  const conf=bestScore>=80?'hoch':bestScore>=55?'mittel':'niedrig';
  return{row:best,score:bestScore,confidence:conf};
}

function processImportFiles(files){
  const existing=S.importFiles.map(x=>x.name);
  let added=0;
  files.forEach(file=>{
    if(existing.includes(file.name))return;
    const parsed=parseFilename(file.name);
    const match=matchExcel(parsed);
    const item={file,name:file.name,parsed,match,status:'pending',img:null,analysing:false,result:null,matchCoating:match?.row?.coating||'',matchStandzeit:match?.row?.standzeit?String(match.row.standzeit):'',decision:null,expanded:false};
    S.importFiles.push(item);
    added++;
    const r=new FileReader();
    r.onload=ev=>{item.img=ev.target.result; re();};
    r.readAsDataURL(file);
  });
  if(!added) showNotif('Alle Dateien bereits vorhanden.',true);
  re();
}

function updateImpField(idx,field,val){
  const item=S.importFiles[idx]; if(!item)return;

}

async function startBulkAnalysis(){
  if(S.importAnalysing)return;
  const pending=S.importFiles.filter(f=>f.status==='pending');
  if(!pending.length){showNotif('Keine ausstehenden Dateien.',true);return;}
  S.importAnalysing=true; S.importProgress=0; re();
  let done=0;
  for(const item of S.importFiles){
    if(item.status!=='pending'){done++;continue;}
    item.analysing=true; re();
    const tp=toolProfile(item.parsed.toolId);
    const coat=item.matchCoating||'70004 (Duplex Variantic)';
    const cn=coatingName(coat);
    const st=item.matchStandzeit?formatStandzeit(parseStandzeit(item.matchStandzeit)):'unbekannt';
    const prompt=`Experte Tiefziehwerkzeug Verschleissanalyse PVD/CVD.\n\nWerkzeug: ${item.parsed.toolId} (${tp.type} Ø ${tp.diameter})\nBeschichtung: ${cn}\nPA: ${item.parsed.pa||'?'} Nr.${item.parsed.nummer||'?'}\nStandzeit: ${st} Huebe\nWerkstoff: ${item.parsed.werkstoff||'?'}\n${tp.fokus}\n\nBild: Stereomikroskop-Aufnahme.\nAnalysiere: Schichtfarbe (dunkel=intakt, golden/kupfer=Substrat), Verschleissmuster.\n\nNUR JSON ohne Markdown:\n{"verdict":"Weiterverwenden","schicht":"Vorhanden gut","verschleisstyp":"Abrasion","bereiche":"Ziehflaeche","diagnose":"...","ursache":"...","empfehlung":"...","confidence":75}`;
    try{
      const msgs=item.img?[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:item.img.split(',')[1]}},{type:'text',text:prompt}]}]:[{role:'user',content:prompt}];
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:msgs})});
      const data=await resp.json();
      const txt=(data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
      const obj=JSON.parse(txt.replace(/```json|```/g,'').trim());
      const sm={'Vorhanden gut':'Vorhanden – guter Zustand','Vorhanden leicht':'Vorhanden – leichter Verschleiß','Vorhanden stark':'Vorhanden – starker Verschleiß','Substrat sichtbar':'Substrat sichtbar – Schicht weitgehend abgetragen'};
      if(sm[obj.schicht]) obj.schicht=sm[obj.schicht];
      item.result=obj; item.status='analysed';
    }catch(err){
      item.result={verdict:'Reparatur prüfen',schicht:'Vorhanden – leichter Verschleiß',verschleisstyp:'Abrasion',bereiche:tp.bereiche[0],diagnose:'Analyse nicht verfügbar.',ursache:'–',empfehlung:'Manuelle Prüfung.',confidence:0};
      item.status='analysed';
    }
    item.analysing=false; done++;
    S.importProgress=Math.round(done/S.importFiles.length*100);
    re();
  }
  S.importAnalysing=false;
  showNotif(`${pending.length} Fotos analysiert!`);
  re();
}

function buildImportEntry(item){
  const r=item.result, dec=item.decision||{};
  const coat=item.matchCoating||'70004 (Duplex Variantic)';
  const st=item.matchStandzeit?parseStandzeit(item.matchStandzeit):0;
  const tp=toolProfile(item.parsed.toolId);
  const finalVerdict=dec.befund||r?.verdict||'Reparatur prüfen';
  const notizParts=[`Import: ${item.name}`];
  if(item.parsed.werkstoff) notizParts.push(`Werkstoff: ${item.parsed.werkstoff}`);
  if(item.match) notizParts.push(`Excel-Match: PA ${item.match.row.pa} (${item.match.confidence})`);
  if(dec.kommentar) notizParts.push(`Operator: ${dec.kommentar}`);
  if(dec.reparaturOption) notizParts.push(`Reparatur: ${dec.reparaturOption}`);
  return{
    id:uid(),date:new Date().toISOString(),
    tool:item.parsed.toolId,pa:item.parsed.pa||'',nummer:item.parsed.nummer||'',
    coating:coat,coatingName:coatingName(coat),standzeit:st,standzeitRaw:formatStandzeit(st),
    durchmesser:'',ausbaugrund:'planmäßig',bereich:item.parsed.aufnahme||tp.bereiche[0]||'',
    notizen:notizParts.join(' | '),img:item.img,imgName:item.name,
    kiVerdict:r?.verdict||'',kiSchicht:r?.schicht||'',kiVerschleisstyp:r?.verschleisstyp||'',
    kiDiagnose:r?.diagnose||'',kiKonfidenz:r?.confidence||0,
    verdict:finalVerdict,schicht:dec.schicht||r?.schicht||'',
    verschleisstyp:dec.verschleissart||r?.verschleisstyp||'',
    diagnose:r?.diagnose||'',ursache:r?.ursache||'',empfehlung:r?.empfehlung||'',verbesserung:'',
    reparaturOption:dec.reparaturOption||'',reparaturKommentar:dec.reparaturKommentar||'',
    operatorKommentar:dec.kommentar||'',bestaetigt:dec.bestaetigt||false,entscheider:dec.entscheider||'',
    user:S.user.name,userId:S.user.id,importedFrom:item.name,
  };
}

function buildFewShotContext(){
  const cases=S.lernFaelle.slice(0,15);
  if(!cases.length)return '';
  let ctx=`\n\nWISSENSBASIS: ${cases.length} gelabelte Expertenfaelle als Referenz:\n\n`;
  cases.forEach((f,i)=>{
    const sk=SCHADENSKLASSEN.find(s=>s.id===f.schadensklasse);
    ctx+=`Fall ${i+1}: ${f.tool} | ${f.coatingName} | ${formatStandzeit(f.standzeit)} Huebe\n`;
    ctx+=`KLASSE: ${sk?.label||f.schadensklasse} | VERSCHLEISS: ${f.verschleissart}\n`;
    ctx+=`BESCHREIBUNG: ${f.beschreibung}\n`;
    if(f.empfehlung) ctx+=`EMPFEHLUNG: ${f.empfehlung}\n`;
    ctx+='\n';
  });
  return ctx;
}

function handleDataImport(e){

}

function re(){
  const root=document.getElementById('app');
  if(!root)return;
  if(S.view==='login'){ root.innerHTML=renderLogin(); return; }
  root.innerHTML=renderApp();
  // Re-attach drag events
  const upz=document.getElementById('upz');
  if(upz){ upz.addEventListener('dragover',e=>{e.preventDefault();upz.classList.add('hover');}); upz.addEventListener('dragleave',()=>upz.classList.remove('hover')); upz.addEventListener('drop',handleDrop); }
  const impDz=document.getElementById('imp-dz');
  if(impDz){ impDz.addEventListener('dragover',e=>{e.preventDefault();impDz.classList.add('hover');}); impDz.addEventListener('dragleave',()=>impDz.classList.remove('hover')); impDz.addEventListener('drop',handleImportDrop); }
}

function renderDashUebersicht(total,gruen,gelb,rot,lernN,laborOffen,dokN){
  function pct(a,b){return b>0?Math.round(a/b*100):0;}
  var recent=S.entries.slice(0,5);

  // KPI row
  var kpis=[
    {l:'Analysen gesamt',v:total,sub:'dokumentiert',col:'#1D1D1F',bg:'#F5F5F7'},
    {l:'Weiterverwenden',v:gruen,sub:pct(gruen,total)+'% gut',col:'#34C759',bg:'#F0FFF4'},
    {l:'Reparatur prüfen',v:gelb,sub:pct(gelb,total)+'% offen',col:'#FF9500',bg:'#FFF8ED'},
    {l:'Verschrottet',v:rot,sub:pct(rot,total)+'% ausgesch.',col:'#FF3B30',bg:'#FFF2F1'},
  ];
  var out='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">';
  kpis.forEach(function(m){
    out+='<div style="background:'+m.bg+';border-radius:14px;padding:16px 18px">'
      +'<div style="font-size:10px;font-weight:600;color:'+m.col+';text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;opacity:.7">'+m.l+'</div>'
      +'<div style="font-size:32px;font-weight:300;color:'+m.col+';line-height:1">'+m.v+'</div>'
      +'<div style="font-size:11px;color:'+m.col+';opacity:.6;margin-top:5px">'+m.sub+'</div>'
      +'</div>';
  });
  out+='</div>';

  // Monthly trend (last 6 months)
  var now=new Date(), months=[];
  for(var i=5;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var n=S.entries.filter(function(e){var ed=new Date(e.date);return ed.getFullYear()===d.getFullYear()&&ed.getMonth()===d.getMonth();}).length;
    months.push({label:d.toLocaleDateString('de-AT',{month:'short'}),n:n});
  }
  var maxM=Math.max.apply(null,months.map(function(m){return m.n;}));
  maxM=maxM||1;

  out+='<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px">';

  // Trend card
  out+='<div style="background:var(--bg1);border:0.5px solid var(--brd);border-radius:18px;padding:20px 22px">'
    +'<div style="font-size:13px;font-weight:600;margin-bottom:4px">Aktivität – letzte 6 Monate</div>'
    +'<div style="font-size:11px;color:var(--txt2);margin-bottom:16px">Analysen pro Monat</div>'
    +'<div style="display:flex;align-items:flex-end;gap:8px;height:80px">';
  months.forEach(function(m){
    var h=Math.round(m.n/maxM*64);
    out+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">'
      +'<div style="font-size:9px;color:var(--txt2);font-weight:500">'+(m.n||'')+'</div>'
      +'<div style="width:100%;border-radius:5px 5px 0 0;background:'+(m.n?'#0071E3':'var(--bg3)')+';min-height:3px;height:'+h+'px"></div>'
      +'<div style="font-size:9px;color:var(--txt2)">'+m.label+'</div>'
      +'</div>';
  });
  out+='</div>';
  if(total>0){
    out+='<div style="margin-top:14px;padding-top:12px;border-top:0.5px solid var(--brd)">';
    [[' Weiterverwenden',gruen,'#34C759'],['Reparatur prüfen',gelb,'#FF9500'],['Verschrottet',rot,'#FF3B30']].forEach(function(r){
      out+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
        +'<div style="width:8px;height:8px;border-radius:50%;background:'+r[2]+';flex-shrink:0"></div>'
        +'<span style="font-size:11px;flex:1">'+r[0]+'</span>'
        +'<div style="flex:2;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden">'
        +'<div style="height:100%;background:'+r[2]+';width:'+pct(r[1],total)+'%;border-radius:3px"></div></div>'
        +'<span style="font-size:11px;color:var(--txt2);min-width:40px;text-align:right">'+r[1]+' ('+pct(r[1],total)+'%)</span>'
        +'</div>';
    });
    out+='</div>';
  }
  out+='</div>';

  // Wissensbasis card
  out+='<div style="background:var(--bg1);border:0.5px solid var(--brd);border-radius:18px;padding:20px 22px">'
    +'<div style="font-size:13px;font-weight:600;margin-bottom:14px">Wissensbasis</div>';
  var wItems=[
    {l:'Lernfälle',v:lernN,icon:'🧠',col:'#534AB7',bg:'#EEEDFE',action:"setTab('lernen')",hint:'KI-Training'},
    {l:'Dokumente',v:dokN,icon:'📄',col:'#185FA5',bg:'#EBF4FF',action:"setTab('wissen');S.wissenTab='dokumente';re()",hint:'Labor, Berichte'},
    {l:'Labor offen',v:laborOffen,icon:'⚗️',col:'#FF9500',bg:'#FFF8ED',action:"setTab('labor')",hint:'Aufträge'},
  ];
  wItems.forEach(function(x){
    out+='<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--brd);cursor:pointer" onclick="'+x.action+'">'
      +'<div style="width:32px;height:32px;background:'+x.bg+';border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">'+x.icon+'</div>'
      +'<div style="flex:1"><div style="font-size:12px;font-weight:500">'+x.l+'</div>'
      +'<div style="font-size:10px;color:var(--txt2)">'+x.hint+'</div></div>'
      +'<div style="font-size:20px;font-weight:300;color:'+x.col+'">'+x.v+'</div>'
      +'<span style="color:var(--txt2);font-size:14px">›</span></div>';
  });
  out+='<button class="btn btn-s btn-wide" style="font-size:12px;margin-top:12px" onclick="setTab(\'wissen\')">📚 Wissen &amp; Lernen →</button>';
  out+='</div></div>';

  // Recent entries
  out+='<div style="background:var(--bg1);border:0.5px solid var(--brd);border-radius:18px;padding:20px 22px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
    +'<div style="font-size:13px;font-weight:600">Letzte Analysen</div>'
    +'<button class="btn btn-s" style="font-size:12px" onclick="setTab(\'history\')">Alle anzeigen →</button></div>';
  if(!recent.length){
    out+='<div style="padding:20px;text-align:center;color:var(--txt2);font-size:12px">Noch keine Analysen.<br><br>'
      +'<button class="btn btn-p" onclick="setTab(\'analyse\')">Erste Analyse starten →</button></div>';
  } else {
    recent.forEach(function(e){
      var vc=e.verdict==='Weiterverwenden'?'b-ok':e.verdict==='Verschrotten'?'b-ba':'b-wa';
      var vi=e.verdict==='Weiterverwenden'?'✓':e.verdict==='Verschrotten'?'✕':'⚠';
      out+='<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:0.5px solid var(--brd);cursor:pointer" onclick="openDetail(\''+e.id+'\')">'
        +(e.img?'<img src="'+e.img+'" style="width:40px;height:40px;object-fit:cover;border-radius:8px;flex-shrink:0">'
               :'<div style="width:40px;height:40px;background:var(--bg2);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center">⚙️</div>')
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+e.tool+' · PA '+e.pa+' · Nr.'+(e.nummer||'–')+'</div>'
        +'<div style="font-size:11px;color:var(--txt2)">'+(e.coatingName||'')+' · '+formatStandzeit(e.standzeit)+' Hübe · '+shortDate(e.date)+'</div>'
        +'</div>'
        +'<span class="badge '+vc+'" style="font-size:11px">'+vi+' '+e.verdict+'</span>'
        +'<span style="color:var(--txt2)">›</span></div>';
    });
  }
  out+='</div>';
  return out;
}

  var laborOffen=S.laborFaelle.filter(function(f){return f.status==='auftrag'||f.status==='laufend';});
  var batchOffen=(S.batchItems||[]).filter(function(x){return !x.saved;});
  var out='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">';

  } else {

        +(e.img?'<img src="'+e.img+'" style="width:36px;height:36px;object-fit:cover;border-radius:7px;flex-shrink:0">'

        +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">'+e.tool+' Nr.'+(e.nummer||'–')+'</div>'

async function startAehnlichsuche(){
  if(!S.aehnlichImg){showNotif('Bitte Foto hochladen.',true);return;}
  S.aehnlichLoading=true;S.aehnlichResult=null;re();
  var allCases=[
    ...S.entries.map(function(e){return {id:e.id,tool:e.tool,pa:e.pa,nummer:e.nummer,coating:e.coatingName||coatingName(e.coating),standzeit:e.standzeit,text:(e.diagnose||'')+(e.verschleisstyp?', '+e.verschleisstyp:''),verdict:e.verdict};}),
    ...S.lernFaelle.map(function(f){return {id:f.id,tool:f.tool,pa:f.pa,nummer:f.nummer,coating:f.coatingName||coatingName(f.coating),standzeit:f.standzeit,text:f.beschreibung+(f.verschleissart?', '+f.verschleissart:''),klasse:f.schadensklasse};})
  ].slice(0,25);
  var caseList=allCases.map(function(c,i){return 'Fall '+(i+1)+' [ID:'+c.id+']: '+c.tool+' PA '+(c.pa||'?')+' Nr.'+(c.nummer||'?')+' '+(c.coating||'')+' '+formatStandzeit(c.standzeit||0)+' Huebe. '+(c.text||'');}).join(' | ');
  var prompt='Du bist Experte fuer Tiefziehwerkzeug-Verschleissanalyse. Analysiere das Foto und vergleiche mit diesen Faellen: '+caseList+' Finde die 3 aehnlichsten nach Schadensmuster. NUR JSON: {"klasse":"gruen","verschleiss":"Abrasion","diagnose":"...","empfehlung":"...","aehnliche":[{"id":"id1","score":85},{"id":"id2","score":72}]}';
  try{
    var result=await callClaude(prompt,S.aehnlichImg);
    S.aehnlichResult=JSON.parse(result.replace(/```json|```/g,'').trim());
    showNotif((S.aehnlichResult.aehnliche||[]).length+' ähnliche Fälle gefunden!');
  }catch(err){
    showNotif('Fehler: '+err.message,true);
    S.aehnlichResult={klasse:'gelb',verschleiss:'–',diagnose:'Analyse nicht verfügbar.',empfehlung:'–',aehnliche:[]};
  }
  S.aehnlichLoading=false;re();
}

function renderHistory(){
  const PAGE=25;
  const allTools=[...new Set(S.entries.map(e=>e.tool))].sort();
  const allCoats=[...new Set(S.entries.map(e=>e.coatingName||coatingName(e.coating)))].sort();
  let filtered=S.entries.filter(e=>{
    if(S.histFilter!=='alle'&&e.verdict!==S.histFilter)return false;
    if(S.histTool!=='alle'&&e.tool!==S.histTool)return false;
    if(S.histCoating!=='alle'&&(e.coatingName||coatingName(e.coating))!==S.histCoating)return false;
    if(S.histDateFrom&&e.date<S.histDateFrom)return false;
    if(S.histDateTo&&e.date>S.histDateTo+'T23:59')return false;
    if(S.histSearch){ const q=S.histSearch.toLowerCase(); if(!`${e.tool} ${e.pa} ${e.nummer} ${e.coatingName||''} ${e.diagnose||''} ${e.user||''}`.toLowerCase().includes(q))return false; }
    return true;
  });
  const page=S.histPage||0;

      <div class="filter-row" style="margin-bottom:0">
        ${['alle','Weiterverwenden','Reparatur prüfen','Verschrotten'].map(v=>`<button class="fchip ${S.histFilter===v?'on':''}" onclick="S.histFilter='${v}';S.histPage=0;re()">${v==='alle'?'Alle Befunde':v}</button>`).join('')}
        ${S.histSearch||S.histFilter!=='alle'||S.histTool!=='alle'||S.histCoating!=='alle'||S.histDateFrom||S.histDateTo?`<button class="fchip" onclick="S.histSearch='';S.histFilter='alle';S.histTool='alle';S.histCoating='alle';S.histDateFrom='';S.histDateTo='';S.histPage=0;re()" style="color:var(--ba)">✕ Zurücksetzen</button>`:''}
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      ${shown.length===0?`<div class="tbl-empty">${S.entries.length===0?'Noch keine Analysen.':'Kein Eintrag für diesen Filter.'}</div>`:`
      <table class="tbl">

        <tbody>
          ${shown.map(e=>`<tr onclick="openDetail('${e.id}')">
            <td style="white-space:nowrap;font-size:11px">${shortDate(e.date)}</td>
            <td style="font-weight:600">${e.tool}</td>

            <td style="font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap">${formatStandzeit(e.standzeit)}</td>
            <td><span class="badge ${verdictClass(e.verdict)}">${verdictIcon(e.verdict)} ${e.verdict}</span></td>
            <td style="font-size:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.schicht||'–'}</td>
            <td style="font-size:11px;color:var(--txt2)">${e.user}</td>
            ${isAdmin()?`<td onclick="event.stopPropagation()"><button class="btn btn-ba" style="padding:3px 8px;font-size:11px" onclick="confirmDelete('${e.id}')">Löschen</button></td>`:''}
          </tr>`).join('')}

      </table>`}

    ${filtered.length>PAGE?`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--txt2)">

        ${page>0?`<button class="btn btn-s" style="font-size:12px" onclick="S.histPage=${page-1};re()">← Zurück</button>`:''}
        ${(page+1)*PAGE<filtered.length?`<button class="btn btn-s" style="font-size:12px" onclick="S.histPage=${page+1};re()">Weiter →</button>`:''}
      </div>
    </div>`:''}
  </div>`;
}

// ---- VERGLEICH ----
function renderVergleich(){
  const MAX_MIO=4.99;
  const sorted=Object.entries(COATINGS).filter(([,c])=>c.n>0).sort((a,b)=>b[1].avgMio-a[1].avgMio);
  const myStats={};
  S.entries.forEach(e=>{ const c=e.coatingName||coatingName(e.coating); if(!myStats[c]) myStats[c]={ok:0,rep:0,bad:0,n:0,sum:0}; myStats[c].n++; myStats[c].sum+=(e.standzeit||0); if(e.verdict==='Weiterverwenden')myStats[c].ok++; else if(e.verdict==='Verschrotten')myStats[c].bad++; else myStats[c].rep++; });
  return `<div>
    <div style="margin-bottom:18px"><div style="font-size:20px;font-weight:600">Beschichtungsvergleich</div><div style="font-size:11px;color:var(--txt2);margin-top:2px">Historische Daten (Excel) + eigene Analysen</div></div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-title"><span class="ct-icon">📊</span>Ø Standzeit nach Beschichtung (historische Excel-Daten)</div>
      ${sorted.map(([k,c])=>`<div class="bar-row">
        <div class="bar-hd"><div style="display:flex;align-items:center;gap:7px"><div style="width:10px;height:10px;border-radius:50%;background:${c.color};flex-shrink:0"></div><span class="bar-name">${c.name}</span><span style="font-size:10px;color:var(--txt2)">${c.supplier}</span></div><span class="bar-info">n=${c.n} · Ø ${c.avgMio} Mio · max ${c.maxMio} Mio</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c.avgMio/MAX_MIO*100)}%;background:${c.color}"></div></div>
      </div>`).join('')}
      <div class="warn-hint" style="margin-bottom:0;margin-top:12px">Formera Eifeler Austria: nur n=4 – noch nicht statistisch belastbar. Balinit Formera (70068): n=36, max 4,99 Mio – stärkste Datenbasis neben Duplex Variantic.</div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-title"><span class="ct-icon">⚙️</span>Beste Beschichtung je Werkzeugtyp</div>
      <table class="tbl">
        <thead><tr><th>Werkzeug</th><th>Typ</th><th>Beste Beschichtung</th><th>Ø Standzeit</th><th>Max</th><th>2. Platz</th></tr></thead>
        <tbody>
          <tr><td style="font-weight:600">7266_0730</td><td>Matrize Ø 8,01</td><td style="color:#534AB7;font-weight:600">Duplex Variantic</td><td>2,08 Mio</td><td>3,71 Mio</td><td style="color:var(--txt2)">Balinit Formera 1,97</td></tr>
          <tr><td style="font-weight:600">7266_0734</td><td>Matrize Ø 6,91</td><td style="color:#993C1D;font-weight:600">Balinit Formera</td><td>3,75 Mio</td><td>4,43 Mio</td><td style="color:var(--txt2)">Duplex Variantic 1,48</td></tr>
          <tr><td style="font-weight:600">7266_0779</td><td>Matrize Ø 8,03</td><td style="color:#993C1D;font-weight:600">Balinit Formera</td><td>1,74 Mio</td><td>4,40 Mio</td><td style="color:var(--txt2)">Balinit Lumena 1,65</td></tr>
          <tr><td style="font-weight:600">7266_0819</td><td>Matrize Ø 6,91</td><td style="color:#993C1D;font-weight:600">Balinit Formera</td><td>2,05 Mio</td><td>4,99 Mio</td><td style="color:var(--txt2)">Futura Nano 1,67</td></tr>
          <tr><td style="font-weight:600">7266_0329</td><td>Stempel</td><td style="color:#854F0B;font-weight:600">Formera Eifeler</td><td>3,56 Mio</td><td>4,72 Mio</td><td style="color:var(--txt2)">Eifeler TiAlN 2,52</td></tr>
        </tbody>

    ${Object.keys(myStats).length>0?`<div class="card" style="margin-bottom:14px">

        ${Object.entries(myStats).map(([n,s])=>`<tr><td style="font-weight:500">${n}</td><td>${s.n}</td><td><span class="badge b-ok">${s.ok}</span></td><td><span class="badge b-wa">${s.rep}</span></td><td><span class="badge b-ba">${s.bad}</span></td><td style="font-size:11px">${s.n>0?(s.sum/s.n/1e6).toFixed(2)+' Mio':'–'}</td></tr>`).join('')}

      <button class="btn btn-acc" style="margin-top:12px;font-size:12px" onclick="sendPrompt('Erstelle einen Strategiebericht Beschichtungsoptimierung für unsere Tiefziehwerkzeuge 7266 mit ROI-Analyse und Versuchsplan.')">KI-Strategiebericht ↗</button>

  </div>`;
}

// ---- IMPORT ----
function renderImport(){

  const pending=files.filter(f=>f.status==='pending').length;
  const analysed=files.filter(f=>f.status==='analysed').length;
  const saved=files.filter(f=>f.status==='saved').length;
  const hasExcel=S.excelRows.length>0;

  const excelBar=`<div style="display:flex;gap:8px;align-items:center;padding:10px 14px;background:${hasExcel?'var(--okbg)':'var(--wabg)'};border-radius:var(--r);margin-bottom:12px">
    <span style="font-size:18px">${hasExcel?'✅':'📊'}</span>
    <div style="flex:1"><div style="font-size:12px;font-weight:500;color:${hasExcel?'var(--ok)':'var(--wa)'}">${hasExcel?`Excel geladen: ${S.excelRows.length} Einträge für Abgleich`:'Excel noch nicht geladen'}</div>
    <div style="font-size:10px;color:var(--txt2)">${hasExcel?'Standzzeiten und Beschichtungen werden automatisch zugeordnet':'Standzeittabelle hochladen für automatischen Abgleich'}</div></div>

  </div>`;

  const lexHtml=S.importShowLex?`<div class="card" style="margin-bottom:14px">${renderVerschleissLex()}</div>`:'';

  const dropZone=files.length===0?`<div id="imp-dz" class="upz" style="padding:52px 20px;margin-bottom:14px;cursor:pointer" onclick="document.getElementById('imp-fp').click()">

  const actionBar=files.length>0?`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
    <span style="font-size:12px;font-weight:500">${files.length} Datei${files.length!==1?'en':''}</span>
    <span class="badge b-neu">${pending} ausstehend</span>
    ${analysed>0?`<span class="badge b-ok">${analysed} analysiert</span>`:''}
    ${saved>0?`<span class="badge b-inf">${saved} gespeichert</span>`:''}
    <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
      <input type="file" id="imp-fp2" accept="image/*" multiple style="display:none" onchange="handleImportFilePick(event)">
      <button class="btn btn-s" style="font-size:12px" onclick="document.getElementById('imp-fp2').click()">+ Weitere Fotos</button>
      ${!S.importAnalysing&&pending>0?`<button class="btn btn-acc" onclick="startBulkAnalysis()">🔬 KI-Analyse (${pending} Fotos)</button>`:''}
      ${S.importAnalysing?`<button class="btn btn-p" disabled><span class="spin"></span> ${S.importProgress}%</button>`:''}
      ${analysed>0&&!S.importAnalysing?`<button class="btn btn-ok" onclick="saveAllImported()">✓ Alle ${analysed} speichern</button>`:''}
      <button class="btn btn-s" style="font-size:11px;color:var(--ba)" onclick="if(confirm('Alle Dateien entfernen?')){S.importFiles=[];S.importAnalysing=false;S.importProgress=0;re()}">✕ Reset</button>
    </div>
  </div>`:'';

  const progBar=S.importAnalysing?`<div style="margin-bottom:12px"><div class="prog" style="height:8px"><div class="prog-f" style="width:${S.importProgress}%;transition:width .4s"></div></div><div style="font-size:11px;color:var(--txt2);text-align:center;margin-top:3px">Analysiere ${Math.ceil(S.importProgress/100*files.length)} / ${files.length}...</div></div>`:'';

  // Cards per file
  let cards='';

    const p=item.parsed, m=item.match, r=item.result, dec=item.decision||{};

      const repOpts=`<option value="">– Reparaturart –</option>${REPARATUR_OPT.map(o=>`<option value="${o.id}" ${dec.reparaturOption===o.id?'selected':''}>${o.name}</option>`).join('')}`;
      const selRep=REPARATUR_OPT.find(o=>o.id===dec.reparaturOption);
      const isRep=dec.befund==='Reparatur prüfen', isVer=dec.befund==='Verschrotten';
      expandedHtml=`<div style="border-top:0.5px solid var(--brd);margin-top:10px;padding-top:12px">

            ${isRep?`<select class="fs" style="font-size:11px;margin-bottom:5px" onchange="updateDecision(${i},'reparaturOption',this.value);re()">${repOpts}</select>${selRep?`<div style="font-size:10px;color:var(--txt2);line-height:1.4">${selRep.beschr}</div>`:''}`:''}
            <textarea class="fta" rows="2" style="font-size:11px;margin-top:5px" placeholder="${isRep?'Reparaturanweisung...':'Begründung für Verschrottung...'}" oninput="updateDecision(${i},'reparaturKommentar',this.value)">${dec.reparaturKommentar||''}</textarea>

function renderLernUebersicht(total,gruen,gelb,rot){
  const bar=total===0
    ?`<div class="warn-hint">Noch keine Lernfälle. Starte mit <strong>➕ Lernfall erfassen</strong>.</div>`
    :`<div class="ok-hint" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span style="font-weight:500">${total} Expertenfälle in der Wissensbasis</span><span style="color:var(--ok)">🟢 ${gruen}</span><span style="color:var(--wa)">🟡 ${gelb}</span><span style="color:var(--ba)">🔴 ${rot}</span><button class="btn btn-p" style="margin-left:auto;font-size:12px" onclick="S.lernTab='analyse';re()">🔍 Neues Foto analysieren →</button></div>`;
  const cards=S.lernFaelle.map(f=>{
    const sk=SCHADENSKLASSEN.find(s=>s.id===f.schadensklasse)||SCHADENSKLASSEN[1];
    return `<div style="background:var(--bg1);border:0.5px solid var(--brd);border-left:4px solid ${sk.farbe};border-radius:0 var(--r2) var(--r2) 0;padding:13px 15px;margin-bottom:9px">
      <div style="display:flex;align-items:flex-start;gap:11px">
        ${f.img?`<img src="${f.img}" style="width:60px;height:60px;object-fit:cover;border-radius:7px;flex-shrink:0">`:`<div style="width:60px;height:60px;background:var(--bg2);border-radius:7px;flex-shrink:0"></div>`}
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:600">${sk.icon} ${sk.label}</span>
            <span class="badge b-neu">${f.verschleissart}</span>
            <span style="font-size:10px;color:var(--txt2);margin-left:auto">${(f.datum||'').slice(0,10)} · ${f.experte}</span>
          </div>
          <div style="font-size:11px;color:var(--txt2);margin-bottom:4px">${f.tool} · ${f.coatingName} · PA ${f.pa||'–'} · Nr.${f.nummer||'–'} · ${formatStandzeit(f.standzeit)} Hübe</div>
          <div style="font-size:12px;line-height:1.6">${f.beschreibung}</div>

      </div>
    </div>`;
  }).join('');
  return bar+(total>0?`<div style="margin-top:14px">${cards}</div>`:'');
