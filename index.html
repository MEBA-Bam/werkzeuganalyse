function renderLernAnalyse(){
  const r=S.lernAnalyseResult;
  const n=S.lernFaelle.length;
  const gruen=S.lernFaelle.filter(f=>f.schadensklasse==='gruen').length;
  const gelb=S.lernFaelle.filter(f=>f.schadensklasse==='gelb').length;
  const rot=S.lernFaelle.filter(f=>f.schadensklasse==='rot').length;
  const statusBox=n>0
    ?`<div class="ok-hint" style="margin-bottom:12px">✓ Wissensbasis aktiv: <strong>${n} Expertenfälle</strong> · 🟢${gruen} 🟡${gelb} 🔴${rot}</div>`
    :`<div class="warn-hint" style="margin-bottom:12px">Noch keine Lernfälle – KI arbeitet mit allgemeinem Fachwissen. Für präzisere Ergebnisse erst Lernfälle erfassen.</div>`;
  const drop=`<div class="card" style="margin-bottom:12px">
    <div class="card-title"><span class="ct-icon">🔍</span>Foto analysieren</div>
    <div class="upz ${S.lernAnalyseImg?'has':''}" onclick="document.getElementById('la-img').click()" ondragover="event.preventDefault();this.classList.add('hover')" ondragleave="this.classList.remove('hover')" ondrop="event.preventDefault();const fi=event.dataTransfer.files[0];if(fi){const rr=new FileReader();rr.onload=ev=>{S.lernAnalyseImg=ev.target.result;S.lernAnalyseImgName=fi.name;S.lernAnalyseResult=null;re();};rr.readAsDataURL(fi);}">
      <input type="file" id="la-img" accept="image/*" style="display:none" onchange="handleAnalyseImg(event)">
      ${S.lernAnalyseImg?`<img src="${S.lernAnalyseImg}" style="max-width:100%;max-height:220px;object-fit:cover;border-radius:7px"><div style="font-size:11px;color:var(--ok);margin-top:6px">✓ ${S.lernAnalyseImgName}</div>`:`<div style="font-size:36px;opacity:.3;margin-bottom:8px">🔍</div><div style="font-size:14px;font-weight:500;margin-bottom:3px">Werkzeug-Foto hochladen</div><div style="font-size:11px;color:var(--txt2)">System vergleicht mit ${n} Expertenfällen</div>`}
    </div>
    ${!S.lernAnalysing&&S.lernAnalyseImg&&!r?`<button class="btn btn-acc btn-wide" style="margin-top:10px" onclick="runLernAnalyse()">🧠 KI-Analyse starten (${n} Lernfälle) →</button>`:''}
    ${S.lernAnalysing?`<button class="btn btn-p btn-wide" disabled style="margin-top:10px"><span class="spin"></span> Vergleiche mit Wissensbasis...</button>`:''}
  </div>`;
  let result='';
  if(r){
    const sk=SCHADENSKLASSEN.find(s=>s.id===r.schadensklasse)||SCHADENSKLASSEN[1];
    result=`<div style="background:var(--bg1);border:0.5px solid var(--brd);border-radius:var(--r2);overflow:hidden;margin-bottom:12px">
      <div style="background:${sk.farbe};padding:14px 18px;display:flex;align-items:center;gap:12px">
        <div style="font-size:36px">${sk.icon}</div>
        <div><div style="font-size:18px;font-weight:700;color:#fff">${sk.label}</div><div style="font-size:12px;color:rgba(255,255,255,.85);margin-top:2px">Verschleiß: ${r.verschleissart||'?'} · Schwere: ${r.verschleisskategorie||'?'} · ${n} Lernfälle · Konfidenz: ${r.confidence||0}%</div></div>
      </div>
      <div style="padding:16px 18px">
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-lbl">Schadensdiagnose</div><div class="detail-val">${r.diagnose||'?'}</div></div>
          <div class="detail-item"><div class="detail-lbl">Ursache</div><div class="detail-val">${r.ursache||'?'}</div></div>
        </div>
        <div class="detail-item" style="margin:8px 0"><div class="detail-lbl">Handlungsempfehlung</div><div class="detail-val">${r.empfehlung||'?'}</div></div>
        ${r.reparatur?`<div class="detail-item" style="margin-bottom:8px"><div class="detail-lbl">Reparaturart</div><div class="detail-val">${r.reparatur}</div></div>`:''}
        ${r.aehnlicherFall?`<div style="background:var(--infbg);border-left:3px solid var(--inf);padding:9px 12px;border-radius:0 6px 6px 0;font-size:12px;color:var(--inf);margin:8px 0">Ähnlicher Expertenfall: ${r.aehnlicherFall}</div>`:''}
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
          <button class="btn btn-s" onclick="S.lernAnalyseImg=null;S.lernAnalyseResult=null;re()">Neues Foto</button>
          <button class="btn btn-ok" onclick="saveLernAnalyseAlsFall()">Als Lernfall speichern (mit Korrektur)</button>
          <button class="btn btn-s" onclick="printPDF(null)">🖨 PDF</button>
        </div>
      </div>
    </div>`;
  }
  return statusBox+drop+result;
}

function renderModal(){
  let content='';
  if(S.modal==='user-new'){
    content=`<div class="modal-title">👤 Neuer Benutzer</div>
    <div class="fgrid">
      <div class="fg"><label class="fl">Name <span>*</span></label><input class="fi" id="un" placeholder="Vorname Nachname"></div>
      <div class="fg"><label class="fl">E-Mail <span>*</span></label><input class="fi" id="ue" type="email" placeholder="name@werk.at"></div>
      <div class="fg"><label class="fl">Passwort <span>*</span></label><input class="fi" id="up" type="password" placeholder="min. 6 Zeichen"></div>
      <div class="fg"><label class="fl">Rolle</label><select class="fs" id="ur"><option value="operator">Operator</option><option value="admin">Administrator</option><option value="viewer">Viewer (nur lesen)</option></select></div>
    </div>
    <div class="modal-footer"><button class="btn btn-s" onclick="closeModal()">Abbrechen</button><button class="btn btn-p" onclick="saveUser({name:document.getElementById('un').value,email:document.getElementById('ue').value,pass:document.getElementById('up').value,role:document.getElementById('ur').value},true)">Anlegen</button></div>`;
  }
  else if(S.modal==='user-edit'){
    const u=S.users.find(x=>x.id===S.modalData);
    if(!u){closeModal();return '';}
    content=`<div class="modal-title">✏️ Benutzer bearbeiten</div>
    <div class="fgrid">
      <div class="fg"><label class="fl">Name</label><input class="fi" id="un" value="${u.name}"></div>
      <div class="fg"><label class="fl">E-Mail</label><input class="fi" id="ue" type="email" value="${u.email}"></div>
      <div class="fg"><label class="fl">Neues Passwort (leer = unverändert)</label><input class="fi" id="up" type="password" placeholder="Leer lassen = nicht ändern"></div>
      <div class="fg"><label class="fl">Rolle</label><select class="fs" id="ur"><option value="operator" ${u.role==='operator'?'selected':''}>Operator</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrator</option><option value="viewer" ${u.role==='viewer'?'selected':''}>Viewer</option></select></div>
    </div>
    <div class="modal-footer"><button class="btn btn-s" onclick="closeModal()">Abbrechen</button><button class="btn btn-p" onclick="saveUserEdit('${u.id}')">Speichern</button></div>`;
  }
  else if(S.modal==='detail'){
    const e=S.entries.find(x=>x.id===S.modalData);
    if(!e){closeModal();return '';}
    const tp=toolProfile(e.tool);
    content=`<div class="modal-title">🔍 Analyseeintrag</div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <span class="badge ${verdictClass(e.verdict)}" style="font-size:13px;padding:5px 12px">${verdictIcon(e.verdict)} ${e.verdict}</span>
      ${e.schicht?`<span class="badge b-neu">${e.schicht}</span>`:''}
    </div>
    <div class="detail-grid">
      <div class="detail-item"><div class="detail-lbl">Werkzeug</div><div class="detail-val">${e.tool}</div></div>
      <div class="detail-item"><div class="detail-lbl">Datum</div><div class="detail-val">${shortDate(e.date)}</div></div>
      <div class="detail-item"><div class="detail-lbl">PA-Nummer</div><div class="detail-val">${e.pa}</div></div>
      <div class="detail-item"><div class="detail-lbl">Werkzeug-Nr.</div><div class="detail-val">${e.nummer||'–'}</div></div>
      <div class="detail-item"><div class="detail-lbl">Beschichtung</div><div class="detail-val">${e.coatingName||coatingName(e.coating)}</div></div>
      <div class="detail-item"><div class="detail-lbl">Standzeit</div><div class="detail-val">${formatStandzeit(e.standzeit)} Hübe</div></div>
      <div class="detail-item"><div class="detail-lbl">Durchmesser</div><div class="detail-val">${e.durchmesser||'–'} mm</div></div>
      <div class="detail-item"><div class="detail-lbl">Verschleißtyp</div><div class="detail-val">${e.verschleisstyp||'–'}</div></div>
    </div>
    ${e.diagnose?`<div class="detail-item" style="margin-bottom:8px"><div class="detail-lbl">Schadensdiagnose</div><div class="detail-val">${e.diagnose}</div></div>`:''}
    ${e.ursache?`<div class="detail-item" style="margin-bottom:8px"><div class="detail-lbl">Ursache</div><div class="detail-val">${e.ursache}</div></div>`:''}
    ${e.empfehlung?`<div class="detail-item" style="margin-bottom:8px"><div class="detail-lbl">Handlungsempfehlung</div><div class="detail-val">${e.empfehlung}</div></div>`:''}
    ${e.verbesserung?`<div class="detail-item" style="margin-bottom:8px"><div class="detail-lbl">Verbesserungsvorschlag</div><div class="detail-val">${e.verbesserung}</div></div>`:''}
    ${e.notizen?`<div class="detail-item" style="margin-bottom:8px"><div class="detail-lbl">Notizen</div><div class="detail-val">${e.notizen}</div></div>`:''}
    ${e.img?`<img src="${e.img}" style="max-width:100%;border-radius:var(--r);margin-top:10px;max-height:220px;object-fit:cover">`:''}
    <div style="font-size:11px;color:var(--txt2);margin-top:10px">Erstellt von: ${e.user} · ${shortDate(e.date)}</div>
    <div class="modal-footer">
      ${isAdmin()?`<button class="btn btn-ba" onclick="confirmDelete('${e.id}')">Löschen</button>`:''}
      <button class="btn btn-s" onclick="closeModal()">Schließen</button>
      <button class="btn btn-s" onclick="printPDF('${e.id}');closeModal()">🖨 PDF</button>
    </div>`;
  }
  else if(S.modal==='confirm-delete'){
    const e=S.entries.find(x=>x.id===S.modalData);
    content=`<div class="modal-title">⚠️ Eintrag löschen?</div>
    <div style="font-size:13px;color:var(--txt1);margin-bottom:16px;line-height:1.6">Eintrag <strong>${e?.tool||''}</strong> (PA ${e?.pa||''}, ${shortDate(e?.date)}) wird dauerhaft gelöscht.</div>
    <div class="modal-footer"><button class="btn btn-s" onclick="closeModal()">Abbrechen</button><button class="btn btn-ba" onclick="deleteEntry('${S.modalData}')">Endgültig löschen</button></div>`;
  }
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`;
}

function renderSetup(){
  return '<div class="login-wrap"><div class="login-card">'
    +'<div style="font-size:28px;margin-bottom:12px">⚙️</div>'
    +'<div style="font-size:20px;font-weight:600;margin-bottom:4px">Ersteinrichtung</div>'
    +'<div style="font-size:12px;color:var(--txt2);margin-bottom:22px">Bitte einmalig die Zugangsdaten eingeben. Sie werden sicher in deinem Browser gespeichert.</div>'
    +'<div class="fg"><label class="fl">Supabase API Key</label>'
    +'<input class="fi" id="setup-supa" type="password" placeholder="sb_publishable_..." style="font-family:monospace;font-size:11px"></div>'
    +'<div style="font-size:11px;color:var(--txt2);margin-bottom:12px">→ supabase.com → Projekt → Settings → API Keys → Publishable key</div>'
    +'<div class="fg"><label class="fl">Anthropic API Key (für KI-Analyse)</label>'
    +'<input class="fi" id="setup-ai" type="password" placeholder="sk-ant-api03-..." style="font-family:monospace;font-size:11px"></div>'
    +'<div style="font-size:11px;color:var(--txt2);margin-bottom:20px">→ console.anthropic.com → API Keys</div>'
    +'<button class="btn btn-p btn-wide" onclick="saveSetup()">Speichern & Starten →</button>'
    +'</div></div>';
}

function saveSetup(){
  var supa = document.getElementById('setup-supa').value.trim();
  var ai   = document.getElementById('setup-ai').value.trim();
  if(!supa){ alert('Bitte Supabase Key eingeben.'); return; }
  localStorage.setItem('wa_supa_key', supa);
  if(ai) localStorage.setItem('wa_ai_key', ai);
  SUPABASE_KEY = supa;
  ANTHROPIC_KEY = ai;
  bootMain();
}

async function bootMain(){
  document.getElementById('app').innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#F5F5F7;flex-direction:column;gap:14px"><div style="width:40px;height:40px;border:2.5px solid #E8E8ED;border-top-color:#0071E3;border-radius:50%;animation:spin .7s linear infinite"></div><div style="color:#86868B;font-size:13px;font-family:-apple-system,sans-serif">Verbinde mit Datenbank...</div></div>';
  var done=false;var t=setTimeout(function(){if(!done){done=true;S.storageReady=true;re();}},8000);
  try{await storageLoad();}catch(e){S.storageReady=true;}
  if(!done){done=true;clearTimeout(t);re();}
  setTimeout(function(){var ind=document.getElementById('storage-ind');if(ind){ind.style.background='#34C759';ind.title='Verbunden';}},400);
}

async function boot(){
  // Check if keys are configured
  SUPABASE_KEY = localStorage.getItem('wa_supa_key')||'';
  ANTHROPIC_KEY = localStorage.getItem('wa_ai_key')||'';
  if(!SUPABASE_KEY){
    // Show setup screen
    document.getElementById('app').innerHTML = renderSetup();
    return;
  }
  bootMain();
}
boot();

</script>
